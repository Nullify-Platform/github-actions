---
name: PR Check - YAML Lint

on:
  pull_request:
    branches: [main]
    paths:
      - '**.yml'
      - '**.yaml'
      - .github/workflows/.yamllint

permissions:
  contents: read

jobs:
  yaml-lint:
    name: yaml-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install YAML linter
        run: python -m pip install yamllint==1.37.1
      - name: Lint tracked YAML files
        run: git ls-files -z '*.yml' '*.yaml' | xargs -0 -r yamllint --strict --config-file .github/workflows/.yamllint
